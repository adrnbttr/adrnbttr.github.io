  about:
    enable: true
    title: "About me"
    image: "/me.jpeg"
    content: |-
      I started in backend engineering — APIs, services, databases — and moved into data
      engineering. Today I work where the two meet: **data platforms**.

      That means owning the whole chain rather than one slice of it: modelling and
      migrating data, building the pipelines that move it, provisioning the infrastructure
      underneath, and delivering it to the business through BI and automation.

      Eighteen years of backend work is what makes the data half solid — a pipeline is a
      production system before it is a dataset.

